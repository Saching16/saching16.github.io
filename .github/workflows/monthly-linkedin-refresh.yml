name: Monthly LinkedIn Refresh

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-linkedin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh LinkedIn source
        run: npm run refresh-linkedin

      - name: Regenerate RAG sources
        run: npm run sync-rag

      - name: Open pull request if sources changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Update LinkedIn RAG source"
          title: "Update LinkedIn RAG source"
          body: |
            ## Summary
            - Refreshes LinkedIn-derived RAG source text.
            - Regenerates chatbot RAG sources.

            ## Notes
            - LinkedIn public scraping is best-effort and may produce no changes if LinkedIn blocks unauthenticated access.
          branch: monthly-linkedin-refresh
          delete-branch: true
